version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: inbox_copilot_db
    environment:
      POSTGRES_USER: inbox_dev
      POSTGRES_PASSWORD: inbox_dev_password
      POSTGRES_DB: inbox_dev
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox_dev -d inbox_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inbox_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inbox_copilot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - inbox_network

volumes:
  postgres_data:
    driver: local

networks:
  inbox_network:
    driver: bridge
