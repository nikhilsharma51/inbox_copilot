[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inbox-copilot-backend"
version = "0.1.0"
description = "Inbox Copilot - AI-powered Gmail agent with human approval"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Nikhil", email = "nikhil@example.com"}
]

dependencies = [
    # Core API
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    
    # Configuration
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    
    # Database
    "sqlalchemy[asyncio]==2.0.25",
    "psycopg[binary]==3.1.17",
    "alembic==1.13.1",
    
    # Logging and monitoring
    "structlog==24.1.0",
    
    # Security and crypto
    "cryptography==41.0.7",
    "PyJWT==2.8.1",
    "python-jose==3.3.0",
    
    # OAuth and auth
    "authlib==1.3.0",
    "python-multipart==0.0.6",
    "google-auth-oauthlib==1.5.0",
    
    # HTTP client
    "httpx==0.25.2",
    
    # Rate limiting
    "slowapi==0.1.9",
    
    # SSE (Server-Sent Events)
    "sse-starlette==2.1.0",
    
    # Utilities
    "python-dateutil==2.8.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.4",
    "pytest-asyncio==0.23.1",
    "respx==0.20.2",
    
    # Linting and type checking
    "ruff==0.1.13",
    "pyright==1.1.344",
    "import-linter==2.0",
    
    # Security
    "pip-audit==2.6.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ai_pipeline"]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "C901",   # McCabe complexity
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "W291",   # trailing whitespace (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ai_pipeline"]
known-third-party = ["fastapi", "sqlalchemy", "pydantic"]

# Pyright configuration
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = [".venv", "venv", "migrations"]
ignore = ["tests"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]

# Import-linter configuration
[tool.import-linter]
root_packages = ["app", "ai_pipeline"]

[[tool.import-linter.checkers]]
type = "forbidden"
source_module = "ai_pipeline"
forbidden_modules = ["app"]
description = "ai_pipeline must never import from app (preserve isolation for testing and reusability)"
