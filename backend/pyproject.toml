[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inbox-copilot-backend"
version = "0.1.0"
description = "Inbox Copilot - AI-powered Gmail agent with human approval"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Nikhil", email = "nikhil@example.com"}
]

dependencies = [
    # Core API
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    
    # Configuration
    "pydantic==2.6.1",
    "pydantic-settings==2.1.0",
    
    # Database
    "sqlalchemy[asyncio]==2.0.25",
    "psycopg[binary]==3.1.17",
    
    # Logging and monitoring
    "structlog==24.1.0",
    
    # Security and crypto
    "cryptography==41.0.7",
    "PyJWT==2.8.1",
    "python-jose==3.3.0",
    
    # OAuth and auth
    "authlib==1.3.0",
    "python-multipart==0.0.6",
    "google-auth-oauthlib==1.5.0",
    
    # HTTP client
    "httpx==0.25.2",
    
    # Rate limiting
    "slowapi==0.1.9",
    
    # SSE (Server-Sent Events)
    "sse-starlette==2.1.0",
    
    # AI Pipeline: LLM and agents (versions pinned to those that resolve together)
    "langchain==1.4.9",
    "langchain-core==1.7.6",
    "langchain-groq==1.1.3",
    "langgraph==1.2.20",
    
    # CLI and output
    "click==8.1.7",
    "rich==13.7.0",
    
    # Utilities
    "python-dateutil==2.8.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.4",
    "pytest-asyncio==0.23.1",
    "respx==0.20.2",
    "pytest-mock==3.12.0",
    
    # Security
    "pip-audit==2.6.3",
    
    # Process management for testing
    "psutil==5.9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "ai_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
